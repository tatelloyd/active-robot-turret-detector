# Parameters for tower B (Barad-dur).
#
# Kept as a separate file rather than a diff against tower_a.yaml because the
# two towers are physically distinct hardware: different camera units with
# different measured FOV, and potentially different GPIO wiring. Sharing a file
# would invite calibrating one tower and silently applying it to the other.

/**/two_towers_detector:
  ros__parameters:
    enable_streaming: true

    # Differs from tower A so both streams can run on one host during
    # single-Pi bringup. Harmless once the towers are on separate machines.
    stream_port: 5001

    # PLACEHOLDER: copied from tower A. Re-measure once tower B's camera is
    # physically built -- FOV varies between nominally identical webcams, and
    # this number feeds the tracking gain.
    camera_fov_horizontal_deg: 62.2
    camera_fov_vertical_deg: 48.8

/**/orthanc_tracker_bt:
  ros__parameters:
    # Same pins as tower A. These were 22/23 when both turrets were going to
    # share one Pi's header during bringup; tower B now has its own Pi
    # (barad-dur), so that constraint is gone and one wiring convention across
    # both towers is worth more than the original intent. Moving a turret
    # between Pis is now a non-event.
    # The tower this one stands down for. When the peer reports a target
    # and this tower has none, it holds position instead of sweeping a
    # room already covered. Leave empty to disable coordination entirely
    # -- a tower with no peer behaves exactly as it did before.
    #
    # Peer status is aged out after 2 s, so a peer that is switched off or
    # falls off the network cannot leave this tower holding forever.
    peer_tower_id: "tower_a"

    pan_pin: 17
    tilt_pin: 27
