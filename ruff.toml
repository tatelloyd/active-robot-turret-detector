# Lint configuration for the Python vision nodes.
#
# Kept explicit rather than relying on ruff's defaults so that upgrading the
# linter changes behaviour only when we choose to. CI pins the ruff version for
# the same reason: a linter that silently gains rules turns a green pipeline red
# on a commit that touched nothing.

line-length = 100

# Ubuntu 24.04 ships Python 3.12 and that is what Jazzy builds against, so it
# is what the towers actually execute. Keep this matched to the robot.
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: undefined names, unused imports, bad f-strings
    "W",   # pycodestyle warnings
    "I",   # import ordering
    "UP",  # pyupgrade: outdated syntax
    "B",   # bugbear: likely bugs, mutable default args
]

ignore = [
    "E501",  # line length: reported by the formatter, not worth failing a build over
]

[lint.per-file-ignores]
# The headless test scripts are operator tools run by hand on the Pi. They print
# liberally and are not imported by anything.
"tests/python/*" = ["T201"]

[lint.isort]
# `two_towers` is this package's own namespace, but nothing in the source tree
# looks like it: rosidl generates the Python module from msg/*.msg at build
# time and it exists only in install/.
#
# Left to infer, ruff's isort decides first- vs third-party by looking for a
# matching directory next to the source. That made the classification depend on
# a two_towers/ directory that this commit deletes, so the detector's import
# block was correct before the deletion and I001 after it -- a lint failure in
# a file the deletion never touched.
#
# Declaring it explicitly makes the answer independent of the source layout,
# which is what it should have been all along.
known-first-party = ["two_towers"]
