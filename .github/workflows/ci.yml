name: CI

# Run on every push to main and on every pull request targeting it.
# The PR trigger is the one that matters: it is what lets you require a green
# build before merging (Settings -> Branches -> Add branch protection rule).
on:
  push:
    branches: [main]
  # Deliberately unfiltered by base branch. Restricting to `branches: [main]`
  # means a PR stacked on another PR gets no CI run at all, and a PR with zero
  # checks is visually indistinguishable from one still queueing.
  pull_request:

jobs:
  # ==========================================================================
  # Build the ROS2 package and run whatever tests exist.
  #
  # This runs in the official ROS 2 Jazzy container on Ubuntu 24.04, which is
  # the distribution both Pis run. It will NOT catch anything that depends on
  # real hardware timing or real servos. What it does catch is the large class
  # of breakage that has nothing to do with hardware: malformed .msg files,
  # CMake mistakes, missing dependencies, C++ that does not compile, and
  # headers that moved. Historically that is where most robotics repo breakage
  # lives.
  #
  # The runner is x86_64 and the Pi is arm64. That difference is real but
  # narrow: it will not catch an arm-only miscompile, and it will not catch a
  # wheel that has no aarch64 build. It does catch everything above the
  # instruction set, which is nearly all of it.
  # ==========================================================================
  build:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-jazzy-behaviortree-cpp \
            python3-colcon-common-extensions

      # The runner is x86 with no Raspberry Pi and no pigpio daemon, so we build
      # against the GPIO stubs. Everything above the GPIO boundary -- the
      # behavior tree, the control law, message generation -- is compiled for
      # real and is what we actually care about verifying here.
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build \
            --event-handlers console_direct+ \
            --cmake-args -DTWO_TOWERS_SIM_GPIO=ON -DCMAKE_BUILD_TYPE=Release

      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

      # Evaluate the launch descriptions without starting any nodes. This
      # catches typos, bad substitutions and missing install rules -- the kind
      # of mistake that otherwise only shows up on the robot, which is the
      # worst possible place to discover it.
      - name: Validate launch files
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ros2 launch two_towers tower.launch.py --show-args
          ros2 launch two_towers two_towers.launch.py --show-args

  # ==========================================================================
  # Static checks on the Python detector.
  #
  # Deliberately does not import the module: that would pull in torch,
  # ultralytics and OpenCV and turn a 30-second job into a multi-minute one.
  # Syntax errors and lint violations are catchable without paying that cost.
  #
  # Python 3.12 to match Ubuntu 24.04, which is what Jazzy targets and what
  # the Pis are running. Linting against a different interpreter version than
  # the robot executes is how you get a green pipeline and a broken deploy.
  # ==========================================================================
  lint-python:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned deliberately. An unpinned linter means a new ruff release can
      # fail CI on a commit that changed nothing. Bump this on purpose.
      - name: Install linters
        run: pip install ruff==0.6.9

      - name: Syntax check
        run: python -m compileall -q src/python tests/python launch

      - name: Lint
        run: ruff check src/python tests/python launch
